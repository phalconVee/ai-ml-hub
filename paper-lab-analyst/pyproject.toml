[project]
name = "paper-lab-analyst"
version = "0.1.0"
description = "Upload a scientific paper PDF; agents read its text and figures and write a structured intelligence report"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
