[project]
name = "counsel-copilot"
version = "0.1.0"
description = "A paralegal-style crew: finds the clauses in your legal PDFs, researches legal context on the web when needed, and writes a cited plain-English answer"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "fpdf2>=2.8.0",  # only to generate the sample PDF; the app never writes PDFs
]

[tool.pytest.ini_options]
pythonpath = ["."]
