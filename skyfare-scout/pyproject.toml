[project]
name = "skyfare-scout"
version = "0.1.0"
description = "Multi-agent flight search assistant: plain-language trip in, compared and recommended flights out (information only, no booking)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
