[project]
name = "fallback-sage"
version = "0.1.0"
description = "Agentic RAG: answer from your documents first, fall back to web search"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
