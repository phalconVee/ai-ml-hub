[project]
name = "soundcheck-mcp"
version = "0.1.0"
description = "Audio analysis toolkit exposed as an MCP server, with a Claude-powered Streamlit client."
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=2.8.0",
    # faster-whisper 1.2.1 calls av.open(metadata_errors=...), which PyAV 19 removed.
    "av>=11,<19",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "vadersentiment>=3.3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

# `uv run soundcheck-mcp` starts the MCP server (stdio). This is the command
# Claude Desktop / Claude Code launch; see README "Use it from other MCP clients".
[project.scripts]
soundcheck-mcp = "soundcheck.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundcheck"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs local audio tools / model download; run with SOUNDCHECK_LIVE=1"]
