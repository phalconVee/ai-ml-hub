[project]
name = "webpilot-mcp"
version = "0.1.0"
description = "A Claude agent that drives a real browser through its own Playwright MCP server, with guard rails."
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=2.8.0",
    "mcp>=2.3.0",
    "playwright>=1.65.2",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
