[project]
name = "sightline"
version = "0.1.0"
description = "Live webcam vision with TypeSafe's Jev decision model: typed answers, calibrated confidence, thresholds, human review"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
