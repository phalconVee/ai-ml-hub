[project]
name = "context-forge"
version = "0.1.0"
description = "A research assistant that shows its context engineering: gather, rank, budget, then answer with citations"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
